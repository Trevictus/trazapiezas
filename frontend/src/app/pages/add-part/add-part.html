<main class="min-h-screen bg-zinc-950 pb-32">
  <header class="flex justify-between items-center p-6 border-b border-zinc-800 bg-zinc-950 sticky top-0 z-40">
    <button (click)="router.navigate(['/dashboard'])" class="cursor-pointer hover:opacity-80 transition-opacity">
      <h1 class="text-xl font-black tracking-tighter text-white uppercase italic"><img src="/assets/logo0.2-trans.png" alt="TRAZAPIEZAS" class="h-8 w-auto object-contain"></h1>
    </button>
    <div class="flex gap-3 items-center">
      <button (click)="router.navigate(['/profile'])" class="text-zinc-400 cursor-pointer hover:opacity-80 transition-opacity">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </button>
      <button (click)="logout()" class="text-[#d97707] cursor-pointer hover:opacity-80 transition-opacity">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" y1="12" x2="9" y2="12" />
        </svg>
      </button>
    </div>
  </header>

  <div class="max-w-2xl mx-auto p-4 space-y-6">
    <h2 class="text-2xl font-bold text-white uppercase tracking-tight">Nueva Referencia</h2>
    <p class="text-zinc-500 text-sm mb-6">Introduce los datos técnicos de la pieza</p>

    <form (ngSubmit)="onSubmit()" class="space-y-6 bg-zinc-900 p-8 rounded-2xl border border-zinc-800 shadow-xl">
      
      <!-- Referencia y Marca (Fila 1) -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-xs font-bold text-zinc-400 uppercase mb-2">Referencia</label>
          <input type="text" [(ngModel)]="newPart.reference" name="ref" required
            class="w-full bg-zinc-950 border border-zinc-800 rounded-lg rounded-tl-none p-3 text-white focus:border-industrial-blue outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-zinc-400 uppercase mb-2">Marca</label>
          <input type="text" [(ngModel)]="newPart.brand" name="brand" required
            class="w-full bg-zinc-950 border border-zinc-800 rounded-lg rounded-tl-none p-3 text-white focus:border-industrial-blue outline-none">
        </div>
      </div>

      <!-- Categoría -->
      <div>
        <label class="block text-xs font-bold text-zinc-400 uppercase mb-2">Categoría</label>
        <select [(ngModel)]="newPart.category" name="cat"
          class="w-full bg-zinc-950 border border-zinc-800 rounded-lg rounded-tl-none p-3 text-white focus:border-industrial-blue outline-none">
          <option value="Filtros">Filtros</option>
          <option value="Frenos">Frenos</option>
          <option value="Motor">Motor</option>
          <option value="Suspensión">Suspensión</option>
        </select>
      </div>

      <!-- Descripción -->
      <div>
        <label class="block text-xs font-bold text-zinc-400 uppercase mb-2">Descripción</label>
        <textarea [(ngModel)]="newPart.description" name="desc" rows="3"
          class="w-full bg-zinc-950 border border-zinc-800 rounded-lg rounded-tl-none p-3 text-white focus:border-industrial-blue outline-none"></textarea>
      </div>

      <!-- Stock y Precio -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-xs font-bold text-zinc-400 uppercase mb-2">Stock Inicial</label>
          <input type="number" [(ngModel)]="newPart.stock" name="stock"
            class="w-full bg-zinc-950 border border-zinc-800 rounded-lg rounded-tl-none p-3 text-white focus:border-industrial-blue outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-zinc-400 uppercase mb-2">Precio (€)</label>
          <input type="number" [(ngModel)]="newPart.price" name="price" step="0.01"
            class="w-full bg-zinc-950 border border-zinc-800 rounded-lg rounded-tl-none p-3 text-white focus:border-industrial-blue outline-none">
        </div>
      </div>

      <!-- Botón de acción -->
      <div class="pt-4 flex gap-4">
        <button type="submit" 
          class="flex-1 bg-[#045dd1] hover:bg-[#0355b0] text-white font-bold py-4 rounded-xl rounded-tl-none transition-all shadow-lg shadow-[#045dd1]/20">
          GUARDAR EN INVENTARIO
        </button>
        <button type="button" (click)="router.navigate(['/inventory'])"
          class="px-6 bg-zinc-800 text-zinc-400 font-bold rounded-xl rounded-tl-none hover:bg-zinc-700">
          CANCELAR
        </button>
      </div>
    </form>
  </div>

  <app-navigation></app-navigation>
</main>
