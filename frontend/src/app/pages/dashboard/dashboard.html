<app-navbar></app-navbar>

<main class="min-h-screen bg-zinc-950 p-6">
  <header class="mb-8">
    <h2 class="text-2xl font-bold text-white">Panel de Operaciones</h2>
    <p class="text-zinc-400 text-sm">Resumen de inventario en tiempo real</p>
  </header>

  <!-- Tarjetas de Estadísticas -->
  <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
    <!-- Stock Bajo -->
    <div class="rounded-xl border border-zinc-800 bg-zinc-900 p-5">
      <p class="text-xs font-bold uppercase text-zinc-500">Alertas de Stock</p>
      <h3 class="mt-2 text-3xl font-black text-safety-orange">12</h3>
      <p class="mt-1 text-xs text-zinc-400 italic">Piezas por debajo del mínimo</p>
    </div>

    <!-- Movimientos Hoy -->
    <div class="rounded-xl border border-zinc-800 bg-zinc-900 p-5">
      <p class="text-xs font-bold uppercase text-zinc-500">Movimientos Hoy</p>
      <h3 class="mt-2 text-3xl font-black text-industrial-blue">45</h3>
      <p class="mt-1 text-xs text-zinc-400 italic">Registros en las últimas 24h</p>
    </div>

    <!-- Botón de Acción Rápida -->
    <div class="flex items-center justify-center rounded-xl border-2 border-dashed border-zinc-800 bg-transparent p-5 hover:bg-zinc-900 cursor-pointer transition-colors">
      <button class="flex items-center gap-2 font-bold text-zinc-400">
        <span class="text-2xl">+</span> Nueva Operación
      </button>
    </div>
  </div>
</main>
