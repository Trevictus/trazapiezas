<app-navbar></app-navbar>

<main class="min-h-screen bg-zinc-950 p-6">
  <header class="mb-8">
    <h2 class="text-2xl font-bold text-white">Panel de Operaciones</h2>
    <p class="text-zinc-400 text-sm">Resumen de inventario en tiempo real</p>
  </header>

  <!-- Tarjetas de Estadísticas -->
  <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
    <!-- Stock Bajo -->
    <div class="rounded-xl border border-zinc-800 bg-zinc-900 p-5">
      <p class="text-xs font-bold uppercase text-zinc-500">Alertas de Stock Bajo</p>
      <h3 class="mt-2 text-3xl font-black text-safety-orange">{{ stats.lowStock }}</h3>
      <p class="mt-1 text-xs text-zinc-400 italic">Piezas con menos de 5 unidades</p>
    </div>

    <!-- Movimientos Hoy -->
    <div class="rounded-xl border border-zinc-800 bg-zinc-900 p-5">
      <p class="text-xs font-bold uppercase text-zinc-500">Movimientos Hoy</p>
      <h3 class="mt-2 text-3xl font-black text-industrial-blue">{{ stats.movementsToday }}</h3>
      <p class="mt-1 text-xs text-zinc-400 italic">Entradas y salidas del día</p>
    </div>

    <!-- Total Referencias -->
    <div class="rounded-xl border border-zinc-800 bg-zinc-900 p-5">
      <p class="text-xs font-bold uppercase text-zinc-500">Total Referencias</p>
      <h3 class="mt-2 text-3xl font-black text-white">{{ stats.totalParts }}</h3>
      <p class="mt-1 text-xs text-zinc-400 italic">Piezas dadas de alta en el catálogo</p>
    </div>
</div>
</main>
