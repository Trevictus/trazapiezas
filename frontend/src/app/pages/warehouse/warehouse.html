<header class="flex justify-between items-center p-6 border-b border-zinc-800 bg-zinc-950 sticky top-0 z-40">
  <button (click)="router.navigate(['/dashboard'])" class="cursor-pointer">
    <img src="/assets/LOGO-TRAZAPIEZAS-DEFINITIVO.png" alt="TRAZAPIEZAS" class="h-8">
  </button>
  <div class="flex gap-3 items-center">
    <button (click)="router.navigate(['/profile'])" class="text-zinc-400 cursor-pointer hover:opacity-80">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
      </svg>
    </button>
    <button (click)="logout()" class="text-[#d97707] cursor-pointer hover:opacity-80">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
    </button>
  </div>
</header>

<div class="min-h-screen bg-zinc-950 text-white p-6 pb-24">
  <div class="max-w-6xl mx-auto space-y-8">
    <!-- NUEVA ESTANTERÍA -->
    <section *ngIf="userRole === 'ADMIN'" class="bg-zinc-900 rounded-2xl p-8 border border-zinc-800">
      <h2 class="text-2xl font-black italic uppercase mb-6 text-[#045dd1]">NUEVA ESTANTERÍA</h2>
      <form (ngSubmit)="createShelf()" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold mb-2">Nombre</label>
          <input
            type="text"
            [(ngModel)]="newShelf.name"
            name="name"
            placeholder="Nombre de la estantería"
            class="w-full bg-zinc-800 border border-zinc-700 rounded-lg rounded-tl-none px-4 py-3 text-white outline-none focus:border-[#045dd1]"
          />
        </div>
        <div>
          <label class="block text-sm font-semibold mb-2">Descripción</label>
          <textarea
            [(ngModel)]="newShelf.description"
            name="description"
            placeholder="Descripción de la estantería"
            class="w-full bg-zinc-800 border border-zinc-700 rounded-lg rounded-tl-none px-4 py-3 text-white outline-none focus:border-[#045dd1] h-24 resize-none"
          ></textarea>
        </div>
        <button
          type="submit"
          class="w-full bg-[#045dd1] hover:bg-[#0355b0] text-white font-bold py-3 rounded-xl rounded-tl-none transition font-mono"
        >
          + CREAR ESTANTERÍA
        </button>
      </form>
    </section>

    <!-- LISTADO DE ESTANTERÍAS -->
    <section>
      <h2 class="text-2xl font-black italic uppercase mb-6 text-[#045dd1]">ESTANTERÍAS</h2>
      
      <div class="pb-20">
        <div *ngIf="loading" class="text-center text-zinc-400">Cargando estanterías...</div>

        <div *ngIf="!loading && shelves.length === 0" class="text-center text-zinc-400">
          No hay estanterías registradas
        </div>

        <div *ngIf="!loading && shelves.length > 0" class="grid gap-4">
        <div
          *ngFor="let shelf of shelves"
          class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 flex flex-col md:flex-row items-start md:items-center justify-between gap-4"
        >
          <div class="flex-1">
            <h3 class="text-lg font-bold text-white mb-2">{{ shelf.name }}</h3>
            <p class="text-sm text-zinc-400 mb-2">{{ shelf.description }}</p>
            <p class="text-xs text-[#045dd1] font-mono">{{ (shelf.parts && shelf.parts.length) || 0 }} piezas</p>
          </div>
          <div class="flex gap-3 w-full md:w-auto">
            <button
              (click)="router.navigate(['/inventory/shelf', shelf.id])"
              class="flex-1 md:flex-none bg-zinc-800 hover:bg-zinc-700 text-white px-4 py-2 rounded-lg rounded-tl-none transition font-mono text-sm"
            >
              VER
            </button>
            <button
              *ngIf="userRole === 'ADMIN'"
              (click)="generateQR(shelf)"
              class="flex-1 md:flex-none bg-[#045dd1] hover:bg-[#0355b0] text-white px-4 py-2 rounded-lg rounded-tl-none transition font-mono text-sm"
            >
              GENERAR QR
            </button>
            <button
              *ngIf="userRole === 'ADMIN'"
              (click)="deleteShelf(shelf.id)"
              class="flex-1 md:flex-none bg-[#d97707] hover:bg-[#b45309] text-white px-4 py-2 rounded-lg rounded-tl-none transition font-mono text-sm"
            >
              ELIMINAR
            </button>
          </div>
        </div>
      </div>
      </div>
    </section>
  </div>
</div>

<!-- MODAL QR -->
<div *ngIf="generatingQR.dataUrl" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 p-4">
  <div class="bg-zinc-900 border-2 border-zinc-800 rounded-2xl p-8 max-w-sm w-full">
    <h3 class="text-xl font-black italic uppercase mb-6 text-[#045dd1]">CÓDIGO QR</h3>
    <div class="flex justify-center mb-6 bg-white p-4 rounded-lg">
      <img [src]="generatingQR.dataUrl" alt="QR Code" class="w-64 h-64">
    </div>
    <div class="flex gap-3">
      <button
        (click)="printQR()"
        class="flex-1 bg-[#045dd1] hover:bg-[#0355b0] text-white px-4 py-3 rounded-lg rounded-tl-none transition font-mono font-bold"
      >
        IMPRIMIR
      </button>
      <button
        (click)="closeQRModal()"
        class="flex-1 bg-zinc-800 hover:bg-zinc-700 text-white px-4 py-3 rounded-lg rounded-tl-none transition font-mono font-bold"
      >
        CERRAR
      </button>
    </div>
  </div>
</div>

<app-navigation></app-navigation>
