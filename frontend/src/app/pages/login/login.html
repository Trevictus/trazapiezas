<div class="flex min-h-screen items-center justify-center bg-zinc-950 px-4">
  <div class="w-full max-w-md rounded-2xl border border-zinc-800 bg-zinc-900 p-10 shadow-2xl">
    
    <!-- Logo/Nombre del Proyecto -->
    <div class="mb-8 text-center">
      <img src="/assets/logo.png" alt="TRAZAPIEZAS" class="h-12 w-auto object-contain mx-auto mb-6">
      <p class="mt-2 text-sm uppercase tracking-widest text-zinc-500">Gestión de Stock · Cazapiezas</p>
    </div>

    <form (ngSubmit)="onLogin()" class="space-y-6">
      <!-- Usuario -->
      <div>
        <label class="mb-2 block text-xs font-semibold uppercase text-zinc-400">ID Mecánico</label>
        <input 
          type="text" 
          name="username"
          [(ngModel)]="loginData.username"
          class="w-full rounded-lg rounded-tl-none border border-zinc-700 bg-zinc-800 p-4 text-white outline-none focus:border-industrial-blue focus:ring-1 focus:ring-industrial-blue"
          placeholder="Ej: victor_cp"
          required>
      </div>

      <!-- Contraseña -->
      <div>
        <label class="mb-2 block text-xs font-semibold uppercase text-zinc-400">Contraseña técnica</label>
        <input 
          type="password" 
          name="password"
          [(ngModel)]="loginData.password"
          class="w-full rounded-lg rounded-tl-none border border-zinc-700 bg-zinc-800 p-4 text-white outline-none focus:border-industrial-blue focus:ring-1 focus:ring-industrial-blue"
          placeholder="••••••••"
          required>
      </div>

      <!-- Botón de Acceso -->
      <button 
        type="submit"
        class="w-full rounded-lg rounded-tl-none bg-industrial-blue py-4 font-bold uppercase text-white transition-all hover:bg-[#0355b0] active:scale-[0.98]">
        Entrar al Sistema
      </button>
    </form>

    <p class="mt-8 text-center text-xs text-zinc-600">
      Sistema de trazabilidad v1.0 | Acceso restringido
    </p>
  </div>
</div>
