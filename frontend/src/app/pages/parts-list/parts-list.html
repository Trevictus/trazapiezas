<app-navbar></app-navbar>

<main class="min-h-screen bg-zinc-950 p-4">
  <div class="mb-6 flex items-center justify-between">
    <h2 class="text-xl font-bold text-white uppercase">Inventario</h2>
    <!-- Aquí es donde debe salir el "6" que ves en la consola -->
    <span class="rounded-full bg-industrial-blue/20 px-3 py-1 text-xs font-bold text-industrial-blue border border-industrial-blue/30">
      {{ parts.length }} Referencias
    </span>
  </div>

  <!-- Lista de Piezas -->
  <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
    @for (part of parts; track part.id) {
      <div class="rounded-xl border border-zinc-800 bg-zinc-900 p-5 shadow-lg">
        <div class="flex justify-between items-start mb-3">
          <div>
            <p class="text-[10px] font-mono text-zinc-500 uppercase tracking-widest">REF: {{ part.reference }}</p>
            <h3 class="text-lg font-bold text-white">{{ part.brand }}</h3>
          </div>
          <span class="text-xs font-bold px-2 py-1 bg-zinc-800 text-zinc-400 rounded">
            {{ part.category }}
          </span>
        </div>
        
        <p class="text-sm text-zinc-400 mb-4">{{ part.description }}</p>

        <div class="flex items-center justify-between border-t border-zinc-800 pt-4">
          <span class="text-xs text-zinc-500 uppercase font-bold">Stock Actual</span>
          <span [class]="part.stock < 10 ? 'text-safety-orange' : 'text-industrial-blue'" class="text-2xl font-black">
            {{ part.stock }}
          </span>
        </div>
      </div>
    } @empty {
      <div class="col-span-full py-20 text-center border-2 border-dashed border-zinc-800 rounded-2xl">
        <p class="text-zinc-600 italic">Esperando datos del taller...</p>
      </div>
    }
  </div>
</main>
