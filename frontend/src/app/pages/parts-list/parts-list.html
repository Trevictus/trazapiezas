<app-navbar></app-navbar>

<main class="min-h-screen bg-zinc-950 p-4">

    <!-- Buscador -->
    <div class="mb-6">
        <input type="text" [(ngModel)]="searchTerm" placeholder="Buscar por marca o referencia..."
            class="w-full rounded-xl border border-zinc-800 bg-zinc-900 p-4 text-white outline-none focus:border-industrial-blue focus:ring-1 focus:ring-industrial-blue">
    </div>

    <!-- Cabecera de Inventario -->
    <div class="mb-6 flex items-center justify-between">
        <h2 class="text-xl font-bold text-white uppercase">Inventario</h2>
        
        <div class="flex items-center gap-4">
            <button (click)="router.navigate(['/add-part'])" 
                class="bg-industrial-blue hover:bg-blue-600 text-white px-4 py-2 rounded-lg font-bold text-sm transition-colors">
                + AÑADIR PIEZA
            </button>
            <span class="rounded-full bg-industrial-blue/20 px-3 py-1 text-xs font-bold text-industrial-blue border border-industrial-blue/30">
                {{ filteredParts.length }} Referencias
            </span>
        </div>
    </div>

    <!-- Lista de Piezas -->
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
        @for (part of filteredParts; track part.id) {
        <div class="rounded-xl border border-zinc-800 bg-zinc-900 p-5 shadow-lg">
            <div class="flex justify-between items-start mb-3">
                <div>
                    <p class="text-[10px] font-mono text-zinc-500 uppercase tracking-widest">
                        REF: {{ part.reference }}
                    </p>
                    <h3 class="text-lg font-bold text-white">{{ part.brand }}</h3>
                </div>
                <div class="flex flex-col items-end gap-2">
                    <span class="text-xs font-bold px-2 py-1 bg-zinc-800 text-zinc-400 rounded">
                        {{ part.category }}
                    </span>
                
                    <!-- Botón eliminar -->
                    <button (click)="deletePart(part)" class="text-zinc-600 hover:text-red-500 transition-colors p-1"
                        title="Eliminar pieza">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 6h18" />
                            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
                            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
                            <line x1="10" y1="11" x2="10" y2="17" />
                            <line x1="14" y1="11" x2="14" y2="17" />
                        </svg>
                    </button>
                </div>
            </div>

            <p class="text-sm text-zinc-400 mb-4">{{ part.description }}</p>

            <!-- Sección de Gestión de Stock -->
            <div class="flex items-center justify-between border-t border-zinc-800 pt-4">
                <span class="text-xs text-zinc-500 uppercase font-bold">Gestión de Stock</span>
                
                <div class="flex items-center gap-3">
                    <!-- Botón Menos -->
                    <button (click)="adjustStock(part, -1)" 
                        class="h-8 w-8 rounded-lg border border-zinc-700 bg-zinc-800 text-white hover:bg-zinc-700 flex items-center justify-center font-bold transition-colors">
                        -
                    </button>

                    <!-- Número de Stock -->
                    <span [class]="part.stock < 10 ? 'text-safety-orange' : 'text-industrial-blue'" 
                        class="text-2xl font-black min-w-[40px] text-center">
                        {{ part.stock }}
                    </span>

                    <!-- Botón Más -->
                    <button (click)="adjustStock(part, 1)" 
                        class="h-8 w-8 rounded-lg border border-zinc-700 bg-zinc-800 text-white hover:bg-zinc-700 flex items-center justify-center font-bold transition-colors">
                        +
                    </button>
                </div>
            </div>
        </div>
        } @empty {
        <div class="col-span-full py-20 text-center border-2 border-dashed border-zinc-800 rounded-2xl">
            <p class="text-zinc-600 italic">No se encontraron piezas en el taller...</p>
        </div>
        }
    </div>
</main>
