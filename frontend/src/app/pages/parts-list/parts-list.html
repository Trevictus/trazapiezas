<app-navbar></app-navbar>

<main class="min-h-screen bg-zinc-950 p-4">
    <!-- Buscador -->
    <div class="mb-6">
        <input type="text" [(ngModel)]="searchTerm" placeholder="Buscar por marca o referencia..."
            class="w-full rounded-xl border border-zinc-800 bg-zinc-900 p-4 text-white outline-none focus:border-industrial-blue focus:ring-1 focus:ring-industrial-blue">
    </div>

    <!-- Cabecera -->
    <div class="mb-6 flex items-center justify-between">
        <h2 class="text-xl font-bold text-white uppercase">Inventario Real</h2>
        <button (click)="router.navigate(['/add-part'])" 
            class="bg-industrial-blue hover:bg-blue-600 text-white px-4 py-2 rounded-lg font-bold text-sm">
            + AÑADIR PIEZA
        </button>
    </div>

    <!-- Lista -->
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
        @for (part of filteredParts; track part.id) {
        <div class="rounded-xl border border-zinc-800 bg-zinc-900 p-5 shadow-lg">
            <div class="flex justify-between items-start mb-3">
                <div>
                    <p class="text-[10px] font-mono text-zinc-500 uppercase">REF: {{ part.reference }}</p>
                    <h3 class="text-lg font-bold text-white">{{ part.brand }}</h3>
                </div>
                <span class="text-[10px] font-bold px-2 py-1 bg-zinc-800 text-zinc-400 rounded uppercase">
                    {{ part.category }}
                </span>
            </div>

            <p class="text-sm text-zinc-400 mb-4 h-10 overflow-hidden italic">"{{ part.description }}"</p>

            <!-- Acciones Mixtas -->
            <div class="flex items-center justify-between border-t border-zinc-800 pt-4">
                <div class="flex items-center gap-3">
                    <button (click)="adjustStock(part, -1)" class="h-8 w-8 rounded bg-zinc-800 text-white font-bold">-</button>
                    <span [class]="part.stock < 5 ? 'text-safety-orange' : 'text-industrial-blue'" class="text-2xl font-black">
                        {{ part.stock }}
                    </span>
                    <button (click)="adjustStock(part, 1)" class="h-8 w-8 rounded bg-zinc-800 text-white font-bold">+</button>
                </div>

                <button (click)="router.navigate(['/register-movement', part.id])" 
                    class="bg-industrial-blue/10 hover:bg-industrial-blue text-industrial-blue hover:text-white px-4 py-2 rounded-lg font-bold text-[10px] uppercase border border-industrial-blue/20 transition-all">
                    INSTALAR EN COCHE
                </button>
            </div>
        </div>
        }
    </div>
</main>
