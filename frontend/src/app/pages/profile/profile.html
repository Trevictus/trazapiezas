<main class="min-h-screen bg-zinc-950 pb-32 flex flex-col">
  <header class="flex justify-between items-center p-6 border-b border-zinc-800 bg-zinc-950 sticky top-0 z-40">
    <button (click)="router.navigate(['/dashboard'])" class="cursor-pointer hover:opacity-80 transition-opacity">
      <h1 class="text-xl font-black tracking-tighter text-white uppercase italic"><img src="/assets/logo0.2-trans.png" alt="TRAZAPIEZAS" class="h-8 w-auto object-contain"></h1>
    </button>
    <div class="w-8 h-8"></div>
  </header>

  <div class="max-w-2xl mx-auto p-4 space-y-6 flex-1">
    <div class="flex flex-col items-center justify-center py-12 space-y-8">
      <div class="w-32 h-32 rounded-full bg-sky-600 flex items-center justify-center">
        <span class="text-5xl font-black text-white">{{ user?.username?.substring(0, 2)?.toUpperCase() }}</span>
      </div>

      <div class="text-center space-y-2">
        <h1 class="text-3xl font-black italic uppercase text-white">{{ user?.username }}</h1>
        <p class="text-lg font-black italic uppercase text-sky-500">{{ user?.role }}</p>
      </div>

      <div class="w-full space-y-4">
        <div class="bg-[#1a1a1a] rounded-2xl p-6 border border-zinc-800">
          <p class="text-[10px] font-bold uppercase tracking-widest text-zinc-500 mb-2">Taller</p>
          <p class="text-lg font-black text-white uppercase italic">CAZAPIEZAS S.L.</p>
        </div>

        <div class="bg-[#1a1a1a] rounded-2xl p-6 border border-zinc-800">
          <p class="text-[10px] font-bold uppercase tracking-widest text-zinc-500 mb-2">Versión</p>
          <p class="text-lg font-black text-white uppercase italic">1.0.2-stable</p>
        </div>
      </div>

      <button (click)="logout()" class="w-full bg-zinc-900 text-red-500 font-black py-4 rounded-2xl uppercase italic text-lg border border-zinc-800 hover:border-red-500/30 transition-colors">
        Cerrar Sesión Segura
      </button>
    </div>
  </div>

  <app-navigation></app-navigation>
</main>
