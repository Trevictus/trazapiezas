<div class="max-w-2xl mx-auto p-4 space-y-6">
  <h2 class="text-2xl font-bold text-white uppercase tracking-tight">Nueva Referencia</h2>
  <p class="text-zinc-500 text-sm mb-6">Introduce los datos técnicos de la pieza</p>

  <form
    (ngSubmit)="onSubmit()"
    class="space-y-6 bg-zinc-900 p-8 rounded-2xl border border-zinc-800 shadow-xl"
  >
    <!-- Referencia y Marca (Fila 1) -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div>
        <label class="block text-xs font-bold text-zinc-400 uppercase mb-2">Referencia</label>
        <input
          type="text"
          [(ngModel)]="newPart.reference"
          name="ref"
          required
          class="w-full bg-zinc-950 border border-zinc-800 rounded-lg rounded-tl-none p-3 text-white focus:border-industrial-blue outline-none"
        />
      </div>
      <div>
        <label class="block text-xs font-bold text-zinc-400 uppercase mb-2">Marca</label>
        <input
          type="text"
          [(ngModel)]="newPart.brand"
          name="brand"
          required
          class="w-full bg-zinc-950 border border-zinc-800 rounded-lg rounded-tl-none p-3 text-white focus:border-industrial-blue outline-none"
        />
      </div>
    </div>

    <!-- Categoría -->
    <div>
      <label class="block text-xs font-bold text-zinc-400 uppercase mb-2">Categoría</label>
      <select
        [(ngModel)]="newPart.category"
        name="cat"
        class="w-full bg-zinc-950 border border-zinc-800 rounded-lg rounded-tl-none p-3 text-white focus:border-industrial-blue outline-none"
      >
        <option value="Filtros">Filtros</option>
        <option value="Frenos">Frenos</option>
        <option value="Motor">Motor</option>
        <option value="Suspensión">Suspensión</option>
        <option value="Eléctrico">Eléctrico</option>
        <option value="Carrocería">Carrocería</option>
      </select>
    </div>

    <!-- Descripción -->
    <div>
      <label class="block text-xs font-bold text-zinc-400 uppercase mb-2">Descripción</label>
      <textarea
        [(ngModel)]="newPart.description"
        name="desc"
        rows="3"
        class="w-full bg-zinc-950 border border-zinc-800 rounded-lg rounded-tl-none p-3 text-white focus:border-industrial-blue outline-none"
      ></textarea>
    </div>

    <!-- Estantería (solo para ADMIN) -->
    @if (userRole === 'ADMIN') {
      <div>
        <label class="block text-xs font-bold text-zinc-400 uppercase mb-2">Estantería</label>
        <select
          [(ngModel)]="newPart.shelfId"
          name="shelf"
          class="w-full bg-zinc-950 border border-zinc-800 rounded-lg rounded-tl-none p-3 text-white focus:border-industrial-blue outline-none"
        >
          <option value="">Seleccionar estantería (opcional)</option>
          @for (shelf of shelves; track shelf) {
            <option [value]="shelf.id">
              {{ shelf.name }}
            </option>
          }
        </select>
      </div>
    }

    <!-- Stock y Precio -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div>
        <label class="block text-xs font-bold text-zinc-400 uppercase mb-2">Stock Inicial</label>
        <input
          type="number"
          [(ngModel)]="newPart.stock"
          name="stock"
          class="w-full bg-zinc-950 border border-zinc-800 rounded-lg rounded-tl-none p-3 text-white focus:border-industrial-blue outline-none"
        />
      </div>
      <div>
        <label class="block text-xs font-bold text-zinc-400 uppercase mb-2">Precio (€)</label>
        <input
          type="number"
          [(ngModel)]="newPart.price"
          name="price"
          step="0.01"
          class="w-full bg-zinc-950 border border-zinc-800 rounded-lg rounded-tl-none p-3 text-white focus:border-industrial-blue outline-none"
        />
      </div>
    </div>

    <!-- Botón de acción -->
    <div class="pt-4 flex gap-4">
      <button
        type="submit"
        class="flex-1 bg-[#045dd1] hover:bg-[#0355b0] text-white font-bold py-4 rounded-xl rounded-tl-none transition-all shadow-lg shadow-[#045dd1]/20"
      >
        GUARDAR EN INVENTARIO
      </button>
      <button
        type="button"
        (click)="router.navigate(['/inventory'])"
        class="px-6 bg-zinc-800 text-zinc-400 font-bold rounded-xl rounded-tl-none hover:bg-zinc-700"
      >
        CANCELAR
      </button>
    </div>
  </form>
</div>
