<div class="max-w-2xl mx-auto p-4 space-y-6">
  <!-- Banner de Filtro Activo -->
  @if (filterLowStock) {
    <div
      class="bg-amber-500/10 border border-amber-500/30 rounded-xl p-4 flex justify-between items-center"
    >
      <div class="flex items-center gap-3">
        <div
          class="bg-amber-500 h-6 w-6 rounded-full flex items-center justify-center text-black font-bold text-sm"
        >
          !
        </div>
        <p class="text-sm font-bold text-amber-200">Mostrando solo piezas con stock < 5</p>
      </div>
      <button
        (click)="clearFilter()"
        class="text-amber-400 hover:text-amber-300 font-bold text-xs uppercase"
      >
        Limpiar
      </button>
    </div>
  }

  <!-- Buscador Superior -->
  <div class="bg-[#1a1a1a] rounded-xl flex items-center px-4 border border-zinc-800">
    <input
      type="text"
      [(ngModel)]="searchTerm"
      placeholder="BUSCAR POR MARCA O REFERENCIA..."
      class="bg-transparent border-none outline-none text-white font-bold w-full py-4 uppercase text-xs tracking-widest rounded-tl-none"
    />
  </div>

  <!-- Lista de Piezas -->
  <div class="space-y-4">
    @for (part of filteredParts; track part.id) {
      <div class="bg-[#1a1a1a] border border-zinc-800 rounded-2xl p-5 shadow-lg">
        <div class="flex justify-between items-start mb-4">
          <div>
            <p class="text-[9px] font-bold text-zinc-500 uppercase tracking-widest">
              REF: {{ part.reference }}
            </p>
            <h3 class="text-lg font-black text-white uppercase italic leading-tight">
              {{ part.brand }}
            </h3>
            <span
              class="text-[9px] font-black px-2 py-0.5 bg-zinc-900 text-[#045dd1] rounded border border-[#045dd1]/30 uppercase mt-1 inline-block"
            >
              {{ part.category }}
            </span>
          </div>

          <!-- Ajuste rápido de stock -->
          <div class="flex items-center bg-zinc-900 rounded-lg border border-zinc-800 p-1">
            <button
              (click)="adjustStock(part, -1)"
              class="w-8 h-8 flex items-center justify-center text-zinc-500 font-bold"
            >
              -
            </button>
            <span
              [ngClass]="part.stock < 5 ? 'text-amber-600' : 'text-[#045dd1]'"
              class="px-3 text-sm font-black"
              >{{ part.stock }}</span
            >
            <button
              (click)="adjustStock(part, 1)"
              class="w-8 h-8 flex items-center justify-center text-zinc-500 font-bold"
            >
              +
            </button>
          </div>
        </div>

        <p class="text-[11px] text-zinc-500 mb-5 leading-relaxed">{{ part.description }}</p>

        <div class="flex gap-2 border-t border-zinc-800/50 pt-4">
          <button
            (click)="router.navigate(['/register-movement', part.id])"
            class="flex-1 bg-[#045dd1] text-white font-black py-3 rounded-lg rounded-tl-none text-[10px] uppercase italic tracking-tighter"
          >
            INSTALAR EN COCHE
          </button>
          <button
            (click)="deletePart(part)"
            class="px-4 text-red-600 rounded-lg rounded-tl-none border border-red-800 text-[10px] font-bold uppercase tracking-tighter"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"
              />
            </svg>
          </button>
        </div>
      </div>
    }
  </div>
</div>

<!-- Botón Flotante para Añadir -->
<div class="fixed bottom-24 right-6 z-40">
  <button
    (click)="router.navigate(['/add-part'])"
    class="bg-[#045dd1] text-white p-4 rounded-2xl rounded-tl-none shadow-2xl border-2 border-white/10"
  >
    <svg
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="3"
    >
      <path d="M12 5v14M5 12h14" />
    </svg>
  </button>
</div>
