<div class="max-w-2xl mx-auto p-4 space-y-6">
  <div class="flex flex-col items-center justify-center py-12 space-y-8">
    <div
      class="w-32 h-32 rounded-full bg-[#045dd1] flex items-center justify-center flex-shrink-0 border border-white/10"
    >
      <span class="text-5xl font-black text-white">{{
        user?.username?.substring(0, 2)?.toUpperCase()
      }}</span>
    </div>

    <div class="text-center space-y-2">
      <h1 class="text-3xl font-black italic uppercase text-white">{{ user?.username }}</h1>
      <p class="text-lg font-black italic uppercase text-[#045dd1]">{{ user?.role }}</p>
    </div>

    <div class="w-full space-y-4">
      <div class="bg-[#1a1a1a] rounded-2xl p-6 border border-zinc-800">
        <p class="text-[10px] font-bold uppercase tracking-widest text-zinc-500 mb-2">Taller</p>
        <p class="text-lg font-black text-white uppercase italic">CAZAPIEZAS S.L.</p>
      </div>

      <div class="bg-[#1a1a1a] rounded-2xl p-6 border border-zinc-800">
        <p class="text-[10px] font-bold uppercase tracking-widest text-zinc-500 mb-2">Versión</p>
        <p class="text-lg font-black text-white uppercase italic">1.0.2-stable</p>
      </div>
    </div>

    <button
      (click)="logout()"
      class="w-full bg-zinc-900 text-[#d97707] font-black py-4 rounded-2xl rounded-tl-none uppercase italic text-lg border border-zinc-800 hover:border-[#d97707]/30 transition-colors"
    >
      Cerrar Sesión Segura
    </button>

    @if (user?.role === 'ADMIN') {
      <button
        (click)="router.navigate(['/staff'])"
        class="w-full bg-zinc-900 text-[#045dd1] font-black py-4 rounded-2xl rounded-tl-none uppercase italic text-lg border border-[#045dd1]/30 hover:border-[#045dd1]/60 transition-colors"
      >
        + Gestionar Personal
      </button>
    }
  </div>
</div>
