<div class="fixed bottom-0 left-0 right-0 bg-[#121212] border-t border-zinc-800 z-50">
  <div class="mx-auto flex justify-between items-center w-full px-1 py-2">
    <!-- Dashboard -->
    <button (click)="router.navigate(['/dashboard'])" 
      [class.bg-zinc-800]="router.url === '/dashboard'"
      class="flex flex-col items-center gap-0.5 px-1 py-1 rounded-lg transition-colors flex-1 justify-center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-zinc-400" [class.text-white]="router.url === '/dashboard'">
        <rect x="3" y="3" width="7" height="7" />
        <rect x="14" y="3" width="7" height="7" />
        <rect x="14" y="14" width="7" height="7" />
        <rect x="3" y="14" width="7" height="7" />
      </svg>
      <span class="text-[9px] font-bold uppercase leading-tight text-zinc-400" [class.text-white]="router.url === '/dashboard'">Dashboard</span>
    </button>

    <!-- Almacén -->
    <button (click)="router.navigate(['/inventory'])" 
      [class.bg-zinc-800]="router.url === '/inventory'"
      class="flex flex-col items-center gap-0.5 px-1 py-1 rounded-lg flex-1 justify-center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-zinc-400" [class.text-white]="router.url === '/inventory'">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
        <rect x="9" y="14" width="6" height="5" />
      </svg>
      <span class="text-[9px] font-bold uppercase leading-tight text-zinc-400" [class.text-white]="router.url === '/inventory'">Almacén</span>
    </button>

    <!-- Warehouse (Solo ADMIN) -->
    <button *ngIf="userRole === 'ADMIN'" (click)="router.navigate(['/warehouse'])" 
      [class.bg-zinc-800]="router.url === '/warehouse'"
      class="flex flex-col items-center gap-0.5 px-1 py-1 rounded-lg transition-colors flex-1 justify-center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-zinc-400" [class.text-white]="router.url === '/warehouse'">
        <path d="M3 12h18M3 12l1-7h16l1 7M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7M9 5v2M15 5v2M8 15h8" />
      </svg>
      <span class="text-[9px] font-bold uppercase leading-tight text-zinc-400" [class.text-white]="router.url === '/warehouse'">Estanterías</span>
    </button>

    <!-- Movimientos -->
    <button (click)="router.navigate(['/history'])" 
      [class.bg-zinc-800]="router.url === '/history'"
      class="flex flex-col items-center gap-0.5 px-1 py-1 rounded-lg transition-colors flex-1 justify-center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-zinc-400" [class.text-white]="router.url === '/history'">
        <path d="M7 16l-4-4m0 0l4-4m-4 4h18" />
        <path d="M17 8l4 4m0 0l-4 4m4-4H3" />
      </svg>
      <span class="text-[9px] font-bold uppercase leading-tight text-zinc-400" [class.text-white]="router.url === '/history'">Movimientos</span>
    </button>

    <!-- Perfil -->
    <button (click)="router.navigate(['/profile'])" 
      [class.bg-zinc-800]="router.url === '/profile'"
      class="flex flex-col items-center gap-0.5 px-1 py-1 rounded-lg transition-colors flex-1 justify-center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-zinc-400" [class.text-white]="router.url === '/profile'">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
        <circle cx="12" cy="7" r="4" />
      </svg>
      <span class="text-[9px] font-bold uppercase leading-tight text-zinc-400" [class.text-white]="router.url === '/profile'">Perfil</span>
    </button>
  </div>
</div>
<div class="h-20"></div>
